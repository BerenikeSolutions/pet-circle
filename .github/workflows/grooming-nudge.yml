name: Grooming Nudge

# Sends a single nudge to onboarding users who have been stuck at the
# grooming question for 30+ minutes without replying.
# Runs every 15 minutes — the backend only sends a nudge if the session
# has been inactive for at least 30 minutes AND nudge_sent is false,
# so running frequently is safe and idempotent.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes, all day
  workflow_dispatch:         # allow manual trigger for testing

jobs:
  run-grooming-nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      API_URL: ${{ secrets.PRODUCTION_API_URL }}
      ADMIN_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: PRODUCTION_API_URL secret is not set."
            echo "Add it under: GitHub repo → Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

      - name: Trigger grooming nudge check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL/internal/run-grooming-nudges" \
            -H "X-ADMIN-KEY: $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            --max-time 30)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
